name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  version:
    name: Determine release version
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.sr.outputs.new_release_published }}
      version: ${{ steps.sr.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Semantic Release (dry-run)
        id: sr
        uses: cycjimmy/semantic-release-action@v4
        with:
          dry_run: true
          semantic_version: 24
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build release artifacts
    needs: version
    if: needs.version.outputs.published == 'true'
    runs-on: windows-latest
    strategy:
      matrix:
        runtime: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore src/FlaUI.Mcp/FlaUI.Mcp.csproj

      - name: Publish self-contained
        run: |
          dotnet publish src/FlaUI.Mcp/FlaUI.Mcp.csproj `
            --configuration Release `
            --runtime ${{ matrix.runtime }} `
            --self-contained true `
            --output ./publish/self-contained `
            -p:Version=${{ needs.version.outputs.version }} `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true

      - name: Publish framework-dependent
        run: |
          dotnet publish src/FlaUI.Mcp/FlaUI.Mcp.csproj `
            --configuration Release `
            --runtime ${{ matrix.runtime }} `
            --self-contained false `
            --output ./publish/framework-dependent `
            -p:Version=${{ needs.version.outputs.version }}

      - name: Create ZIP archives
        shell: pwsh
        run: |
          $v = "${{ needs.version.outputs.version }}"
          Compress-Archive -Path ./publish/self-contained/* -DestinationPath ./FlaUI-MCP-${{ matrix.runtime }}-$v-self-contained.zip
          Compress-Archive -Path ./publish/framework-dependent/* -DestinationPath ./FlaUI-MCP-${{ matrix.runtime }}-$v-framework-dependent.zip

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.runtime }}
          path: ./*.zip

  release:
    name: Create GitHub release
    needs: [version, build]
    if: needs.version.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v4
        with:
          semantic_version: 24
          extra_plugins: |
            @semantic-release/exec@7
            @semantic-release/git@10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
