name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    strategy:
      matrix:
        runtime: [win-x64, win-arm64]

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for GitVersion

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v1
      with:
        versionSpec: '5.x'

    - name: Determine Version
      id: gitversion
      uses: gittools/actions/gitversion/execute@v1
      with:
        useConfigFile: true

    - name: Display Version
      run: |
        echo "SemVer: ${{ steps.gitversion.outputs.semVer }}"
        echo "NuGetVersion: ${{ steps.gitversion.outputs.nuGetVersion }}"

    - name: Restore dependencies
      run: dotnet restore FlaUI.Mcp.sln

    - name: Build
      run: |
        dotnet build FlaUI.Mcp.sln `
          --configuration Release `
          --no-restore `
          -p:Version=${{ steps.gitversion.outputs.semVer }}

    - name: Test
      if: matrix.runtime == 'win-x64'
      run: |
        dotnet test tests/FlaUI.Mcp.Tests/FlaUI.Mcp.Tests.csproj `
          --configuration Release `
          --no-build `
          --logger "trx;LogFileName=test-results.trx" `
          --results-directory TestResults

    - name: Upload test results
      if: always() && matrix.runtime == 'win-x64'
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: TestResults/

    - name: Publish
      run: |
        dotnet publish src/FlaUI.Mcp/FlaUI.Mcp.csproj `
          --configuration Release `
          --runtime ${{ matrix.runtime }} `
          --self-contained true `
          --output ./publish/${{ matrix.runtime }} `
          -p:Version=${{ steps.gitversion.outputs.semVer }} `
          -p:PublishSingleFile=true `
          -p:IncludeNativeLibrariesForSelfExtract=true

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: FlaUI-MCP-${{ matrix.runtime }}
        path: ./publish/${{ matrix.runtime }}/
